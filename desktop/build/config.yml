version: '3'
info:
  companyName: Swept
  productName: Swept
  productIdentifier: com.swept.app
  description: A little room to build.
  version: 0.2.0
dev_mode:
  root_path: .
  log_level: warn
  debounce: 500
  ignore:
    dir: [.git, node_modules, frontend, bin]
    file: [.DS_Store, .gitignore, '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 generate bindings -ts -i && env CGO_ENABLED=1 MACOSX_DEPLOYMENT_TARGET=12.0 CGO_CFLAGS=-mmacosx-version-min=12.0 CGO_LDFLAGS=-mmacosx-version-min=12.0 go build -o bin/Swept-dev .
      type: blocking
    - cmd: npm --prefix frontend run dev
      type: background
      readiness:
        http: http://127.0.0.1:9245
        timeout: 30s
        interval: 200ms
    - cmd: ./bin/Swept-dev
      type: primary
      exit_policy: shutdown
