name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview: ${{ steps.version.outputs.preview }}
      signing: ${{ steps.version.outputs.signing }}
    steps:
      - name: Validate the release tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SIGNING: ${{ vars.MACOS_RELEASE_SIGNING || 'notarized' }}
        run: |
          [[ "$REF_TYPE" == tag && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]] || { echo 'Run from a vX.Y.Z or vX.Y.Z-beta.N tag'; exit 1; }
          [[ "$SIGNING" == notarized || "$SIGNING" == unnotarized ]] || { echo 'MACOS_RELEASE_SIGNING must be notarized or unnotarized'; exit 1; }
          echo "signing=$SIGNING" >> "$GITHUB_OUTPUT"
          version=${TAG#v}
          echo "version=${version%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-beta.* ]]; then echo 'preview=true' >> "$GITHUB_OUTPUT"; else echo 'preview=false' >> "$GITHUB_OUTPUT"; fi
  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml
  package:
    needs: [validate, checks]
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      SWEPT_VERSION: ${{ needs.validate.outputs.version }}
      SWEPT_BUILD_NUMBER: ${{ github.run_number }}
      SWEPT_ARCH: universal
      SWEPT_RELEASE_TAG: ${{ github.ref_name }}
      PREVIEW: ${{ needs.validate.outputs.preview }}
      SIGNING: ${{ needs.validate.outputs.signing }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      NOTARY_PROFILE: swept-release
    steps:
      - uses: actions/checkout@v7
      - name: Check signing configuration
        if: needs.validate.outputs.signing == 'notarized'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing $name. See docs/releases.md"; exit 1; }
          done
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - run: desktop/scripts/build.sh
      - name: Import signing credentials into a temporary keychain
        if: needs.validate.outputs.signing == 'notarized'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/swept.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          security default-keychain -d user -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Package and verify the DMG
        run: |
          if [[ "$SIGNING" == unnotarized ]]; then
            if [[ "$PREVIEW" == true ]]; then
              desktop/scripts/package.sh --preview
            else
              desktop/scripts/package.sh --unnotarized
            fi
          else
            desktop/scripts/package.sh
          fi
      - name: Prepare release notes
        run: |
          python3 - <<'PYTHON'
          import json, pathlib
          metadata = next(pathlib.Path('desktop/bin/release').glob('*.json'))
          data = json.loads(metadata.read_text())
          unnotarized = not data['notarized']
          intro = "Swept is a local macOS storage cleaner for developers.\n\n"
          features = "## What you can do\n\n- Scan developer caches and build artifacts, with paths, sizes, and classifications.\n- Select files across categories and review one cleanup.\n- Browse folders by size and inspect their contents.\n- Review individual Docker resources and clean selected items together.\n- Switch between light and dark themes.\n\n"
          compatibility = "## Compatibility\n\nUniversal build for Apple Silicon and Intel Macs. Targets macOS 13+. CI builds, behavioral tests, and native launch pass on macOS 15 for both architectures. macOS 13 and 14 still need verification.\n\n"
          installation = "## Install\n\nOpen the DMG and drag Swept to Applications. "
          if unnotarized:
              installation += "**This release is ad-hoc signed, not Developer ID-signed or notarized by Apple.** macOS may block its first launch. If you trust this download, open System Settings > Privacy & Security and use Open Anyway after trying to launch it. [Apple's instructions](https://support.apple.com/en-us/102445).\n\n"
          else:
              installation += "Signed with Developer ID and notarized by Apple.\n\n"
          command = f"curl -fsSL https://xavier577.github.io/swept/install.sh | /bin/bash -s -- --version {data['version']}"
          if unnotarized:
              command += " --unnotarized"
          installation += f"### Install from Terminal\n\nQuit Swept first if it’s running.\n\n```sh\n{command}\n```\n\n"
          installation += "Installs into `~/Applications` without sudo. Checks the download’s SHA-256 and the app’s signature. "
          if unnotarized:
              installation += "Asks before removing Swept’s quarantine flag. This skips Apple’s downloaded-app check for Swept only; Gatekeeper stays enabled for other apps. "
          installation += "[Read the installer](https://github.com/Xavier577/swept/blob/main/web/public/install.sh) before running it.\n\n"
          sizes = f"Download: {data['downloadBytes']/1024**2:.2f} MiB. Installed files: {data['installedBytes']/1024**2:.2f} MiB. The SHA-256 file verifies the downloaded DMG.\n\n"
          limits = "## Before cleaning\n\nReview the selected paths. Permanent cleanup cannot be undone; Move to Trash is a separate option. Close related apps and builds. Docker inspection and cleanup need a running local engine. Managed-tool cleanup results currently appear in their panels; persistent history covers filesystem cleanup.\n"
          pathlib.Path('release-notes.md').write_text(intro + features + compatibility + installation + sizes + limits)
          PYTHON
      - name: Create a draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Do not replace an existing release or its assets on rerun.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release already exists. Review it in GitHub instead of overwriting its assets.'
            exit 1
          fi
          flags=()
          if [[ "$PREVIEW" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" desktop/bin/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Swept $TAG" --notes-file release-notes.md --generate-notes
      - name: Remove temporary signing credentials
        if: always() && needs.validate.outputs.signing == 'notarized'
        run: |
          security default-keychain -d user -s login.keychain-db || true
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/swept.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
